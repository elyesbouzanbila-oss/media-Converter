[workspace]
resolver = "3"
# The engine lives under engine/ and the UI lives wherever you put it, so the
# two never touch each other's files. When you create your crate, add its path
# here — for example:
#
#     members = ["engine/*", "spikes/*", "app"]
#
# A glob is deliberately not used for the UI directory: cargo has to resolve
# every match into a package, so a half-created directory would break the build
# for both of us.
members = ["engine/*", "spikes/*", "app"]

[workspace.package]
version = "0.1.0-alpha.4"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/docconvert"

[workspace.dependencies]
# --- our engine crates ---
dconv-ir = { path = "engine/ir" }
dconv-pdf = { path = "engine/pdf" }
dconv-docx = { path = "engine/docx" }
dconv-engine = { path = "engine/convert" }

# --- serialization / errors ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"

# --- concurrency ---
rayon = "1.12"
crossbeam-channel = "0.5"

# --- logging / diagnostics ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- command line ---
clap = { version = "4", features = ["derive"] }

# --- UI (dconv-app): egui/eframe + native dialogs ---
# `persistence` is not in eframe's default set any more; settings storage
# depends on it.
eframe = { version = "0.37", features = ["persistence"] }
egui_extras = "0.37"
rfd = "0.17"

# --- containers: a .docx is a zip of XML parts ---
zip = "9"
tempfile = "3"

# --- pdf reading (FFI) ---
pdfium-render = { version = "0.9.4", features = ["paragraph"] }

# --- pdf writing (pure rust) ---
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-layout = "0.15.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }

# --- Release: this workload is pure CPU-bound compute, so LTO pays off. ---
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# --- Spikes and benchmarks: fully optimised codegen, but no whole-program
#     LTO, so iteration stays fast. `cargo run --profile spike`. ---
[profile.spike]
inherits = "release"
lto = false
strip = false

# --- Dev: optimise dependencies so heavy crates (typst, pdfium) are usable
#     in debug builds without a 20x slowdown. Our own crates stay unoptimised
#     so debug info and incremental rebuilds stay fast. ---
[profile.dev.package."*"]
opt-level = 2
